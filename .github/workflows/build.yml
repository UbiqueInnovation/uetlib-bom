name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build Project
    permissions:
      contents: read
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@d4556d34f5adf7dc891ed2e65061745c0b3b2a27 # v1.0.0
    with:
      sonar: true
    secrets:
      SONAR_TOKEN: ${{ secrets.UBIQUE_SONAR_TOKEN }}
      UB_ARTIFACTORY_USER: ${{ secrets.UB_ARTIFACTORY_USER }}
      UB_ARTIFACTORY_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
      UB_ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}
      UB_ARTIFACTORY_REPO_UBIQUE: ${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}
      SYSTEMS_UBIQUE_SIGNING_KEY_ARMOR_ASC: ${{ secrets.SYSTEMS_UBIQUE_SIGNING_KEY_ARMOR_ASC }}
      SYSTEMS_UBIQUE_SIGNING_KEY_PASSPHRASE: ${{ secrets.SYSTEMS_UBIQUE_SIGNING_KEY_PASSPHRASE }}


  test-version-bump:
    name: Test Version Bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - uetlib-parent
          - uetlib-test
          - uetlib-testcontainers
          - uetlib-core
          - uetlib-storage
          - uetlib-spring-boot
          - uetlib-spring-boot-test
          - uetlib-storage-spring-boot
          - uetlib-db
          - uetlib-monitoring
          - uetlib-spring-cloud
          - uetlib-job
          - uetlib-geo
          - uetlib-testapp
          - uetlib-self-bom
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25.0.4+7.0.LTS'
          distribution: 'temurin'

      - name: Create custom mvn repository settings.xml
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          repositories: |
            [
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots install

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UbiqueInnovation/${{ matrix.repository }}
          path: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_PAT_GITHUB }}
          ref: main

      - name: Bump Parent Version for package ${{ matrix.repository }}
        run: mvn versions:update-parent -DallowSnapshots=true -f ${{ matrix.repository }}/pom.xml

      - name: Build ${{ matrix.repository }} with Maven
        run: mvn --batch-mode --update-snapshots install -f ${{ matrix.repository }}/pom.xml