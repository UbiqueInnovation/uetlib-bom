name: Build
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - v*

jobs:
  build:
    name: Build Project
    uses: UbiqueInnovation/workflows-backend/.github/workflows/mvn_install.yml@main
    with:
      ref_name: ${{ github.ref_name }}
      parent_pom: pom.xml
    secrets:
      artifactory_user: ${{ secrets.UB_ARTIFACTORY_USER }}
      artifactory_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
      artifactory_url: ${{ secrets.UB_ARTIFACTORY_URL }}
      artifactory_repo: ${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

  test-version-bump:
    name: Test Version Bump
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: uetlib-core
            repository: uetlib-core
            pom_path: uetlib-core/uetlib-core/pom.xml
          - package: uetlib-geo
            repository: uetlib-geo
            pom_path: uetlib-geo/pom.xml
#          - package: uetlib-test
#            repository: uetlib-test
#            pom_path: uetlib-test/uetlib-test/pom.xml
#          - package: uetlib-test
#            repository: uetlib-testcontainers
#            pom_path: uetlib-test/uetlib-testcontainers/pom.xml
          - package: uetlib-db
            repository: uetlib-db
            pom_path: uetlib-db/pom.xml
          - package: uetlib-spring
            repository: uetlib-spring
            pom_path: uetlib-spring/pom.xml
          - package: uetlib-storage-spring
            repository: uetlib-storage-spring
            pom_path: uetlib-storage-spring/pom.xml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Create custom artifactory settings.xml
        uses: whelk-io/maven-settings-xml-action@9dc09b23833fa9aa7f27b63db287951856f3433d
        with:
          servers: '[{"id": "ubique-artifactory", "username": "${{ secrets.UB_ARTIFACTORY_USER }}", "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"}]'
          repositories: '[{"id" : "ubique-artifactory", "url" : "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}"}]'

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots install -DskipTests=true -f ./pom.xml

      - name: Checkout ${{ marix.repository }} to verify ${{ marix.package }}
        uses: actions/checkout@v4
        with:
          repository: UbiqueInnovation/${{ marix.repository }}
          path: ${{ marix.package }}
          token: ${{ secrets.WORKFLOW_PAT_GITHUB }}
          ref: main

      - name: Bump Parent Version for package ${{ marix.package }}
        run: mvn versions:update-parent -DallowSnapshots=true -f ${{ marix.pom_path }}

      - name: Build ${{ marix.package }} with Maven
        run: mvn --batch-mode --update-snapshots install -f ${{ marix.pom_path }}

  deploy-dev-code_quality:
    name: Code Analysis (Sonar Cloud)
    uses: UbiqueInnovation/workflows-backend/.github/workflows/mvn_verify_sonar.yml@main
    with:
      ref_name: ${{ github.ref_name }}
      parent_pom: pom.xml
    secrets:
      artifactory_user: ${{ secrets.UB_ARTIFACTORY_USER }}
      artifactory_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
      artifactory_url: ${{ secrets.UB_ARTIFACTORY_URL }}
      artifactory_repo: ${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}
      sonar_token: ${{ secrets.UBIQUE_SONAR_TOKEN }}
