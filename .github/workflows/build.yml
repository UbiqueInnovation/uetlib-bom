name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Prepare maven
        uses: UbiqueInnovation/action-systems-mvn-prepare@bfeb86b8129a37da7d062487cc1dfb60718836cc # v2.0.0
        with:
          mvn_servers: >-
            [
              {
                "id": "ubique-artifactory",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              },
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          mvn_repositories: >-
            [
              {
                "id": "ubique-artifactory",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}"
              },
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: Maven Install
        id: maven_install
        uses: UbiqueInnovation/action-systems-mvn-install@1e861d926529f75b9a2e02162965f813b944ee0f # v1.3.0
        with:
          parent_pom: pom.xml

      - name: Maven Verify Sonar
        uses: UbiqueInnovation/action-systems-mvn-verify-sonar@d7b1e7a7794f1e3ca136e7f0b25640b16047d4ca # v2.0.0
        with:
          ref_name: ${{ github.ref_name }}
          parent_pom: pom.xml
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          sonar_token: ${{ secrets.UBIQUE_SONAR_TOKEN }}
          tests_ran: ${{ steps.maven_install.outputs.tests_ran }}


  test-version-bump:
    name: Test Version Bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - uetlib-parent
          - uetlib-test
          - uetlib-testcontainers
          - uetlib-core
          - uetlib-storage
          - uetlib-spring-boot
          - uetlib-spring-boot-test
          - uetlib-storage-spring-boot
          - uetlib-db
          - uetlib-monitoring
          - uetlib-spring-cloud
          - uetlib-job
          - uetlib-geo
          - uetlib-testapp
          - uetlib-self-bom
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Create custom mvn repository settings.xml
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          githubServer: false
          servers: >-
            [
              {
                "id": "ubique-artifactory",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          repositories: |
            [
              {
                "id": "ubique-artifactory",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}"
              }
            ]

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots install

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UbiqueInnovation/${{ matrix.repository }}
          path: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_PAT_GITHUB }}
          ref: main

      - name: Bump Parent Version for package ${{ matrix.repository }}
        run: mvn versions:update-parent -DallowSnapshots=true -f ${{ matrix.repository }}/pom.xml

      - name: Build ${{ matrix.repository }} with Maven
        run: mvn --batch-mode --update-snapshots install -f ${{ matrix.repository }}/pom.xml